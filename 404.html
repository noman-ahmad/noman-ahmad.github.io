<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Noman Ahmad</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var el = document.documentElement;
        el.classList.add("js");
        var theme = "light";
        try {
          theme =
            localStorage.getItem("theme") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        } catch (e) {}
        el.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .nf {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 32px;
      }
      .nf-code {
        font-family: var(--font-mono);
        font-size: clamp(4rem, 18vw, 9rem);
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.04em;
        background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #06b6d4));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .nf h1 {
        font-size: clamp(1.5rem, 4vw, 2.1rem);
        margin-block: 18px 12px;
      }
      .nf p {
        color: var(--muted);
        max-width: 44ch;
        margin-inline: auto;
      }
      .nf .btn {
        margin-top: 28px;
      }
    </style>
  </head>
  <body>
    <main class="nf">
      <div>
        <div class="nf-code">404</div>
        <h1>This page doesn&rsquo;t exist</h1>
        <p>The link may be out of date, or the address slightly off. Everything lives on one page anyway.</p>
        <a class="btn btn-primary" href="/">
          Back to the portfolio
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </a>
      </div>
    </main>
  </body>
</html>
